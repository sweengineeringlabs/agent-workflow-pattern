[package]
name = "agent-workflow-pattern"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["SWE Engineering Labs"]
repository = "https://github.com/sweengineeringlabs/agent-workflow-pattern"
rust-version = "1.98.1"
description = "Agent workflow pattern — part of agent-spec ecosystem"
keywords = ["agent", "pattern", "swe"]
